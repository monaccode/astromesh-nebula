[project]
name = "astromesh-nebula"
version = "0.1.0"
description = "Astromesh Nebula — open-model foundry. First family: Centinela (Spanish-first finance)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "huggingface_hub>=0.24",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
eval = ["transformers>=4.44", "torch>=2.3", "accelerate>=0.33", "datasets>=2.19"]
demo = ["gradio>=4.0", "llama-cpp-python>=0.2.80"]
dev = ["pytest>=8.0", "ruff>=0.6", "datasets>=2.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nebula"]

[tool.hatch.build.targets.wheel.force-include]
"nebula/catalog.schema.json" = "nebula/catalog.schema.json"
"nebula/catalog.lock.json" = "nebula/catalog.lock.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
