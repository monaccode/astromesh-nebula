name: preflight
# Manual only — verifies the Hugging Face credentials WITHOUT spending GPU credit.
#
# Why this exists: the `release` workflow submits a billed GPU Job as its very first
# real action. Its first run (2026-06-09) died at `hf auth login` with "Invalid user
# token" — a free 17s failure. But the opposite outcome is expensive: if auth succeeds,
# `release` immediately launches a full training Job. So there was no cheap way to
# answer "are the credentials actually good?" before committing to a billed run.
#
# It DOES launch one job, on cpu-basic ($0.0002/min), because that is the only way to
# prove the `job.write` permission — see the launch step for why listing is not enough.
# It never touches GPU hardware.
on:
  workflow_dispatch:

jobs:
  check-credentials:
    runs-on: ubuntu-latest
    env:
      # The CLI and the API both pick HF_TOKEN up from the environment, so the token
      # is never passed as a command-line argument (which would land in the logs).
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_ORG: ${{ vars.HF_ORG }}
    steps:
      - uses: astral-sh/setup-uv@v5

      - name: Install Hugging Face CLI
        # No `[cli]` extra: huggingface_hub >=1.x ships the `hf` executable in the base
        # package, and asking for the extra only emits a "does not have an extra named
        # cli" warning.
        run: uv tool install huggingface_hub

      - name: Check that HF_ORG is configured
        run: |
          if [ -z "${HF_ORG:-}" ]; then
            echo "::error::vars.HF_ORG is not set. Set it with: gh variable set HF_ORG"
            exit 1
          fi
          echo "HF_ORG=$HF_ORG"

      - name: Validate token, org membership and write access
        id: whoami
        run: |
          set -uo pipefail

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::secrets.HF_TOKEN is empty. Set it with: gh secret set HF_TOKEN"
            exit 1
          fi

          # -w appends the HTTP status on its own line so we can branch on it.
          response=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/whoami-v2)
          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          if [ "$status" != "200" ]; then
            echo "::error::HF rejected the token (HTTP $status). Mint a fresh one at \
          https://huggingface.co/settings/tokens with write access to '$HF_ORG', then: gh secret set HF_TOKEN"
            exit 1
          fi

          # Only selected fields are echoed — the payload also carries the account email.
          user=$(jq -r '.name // "?"' <<<"$body")
          kind=$(jq -r '.type // "?"' <<<"$body")
          token_role=$(jq -r '.auth.accessToken.role // "unknown"' <<<"$body")
          org_role=$(jq -r --arg org "$HF_ORG" \
            '(.orgs[]? | select(.name == $org) | .roleInOrg) // empty' <<<"$body")

          echo "token valid  -> user=$user type=$kind"
          echo "token role   -> $token_role"
          echo "role in $HF_ORG -> ${org_role:-<not a member>}"
          {
            echo "### Hugging Face preflight"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Token valid | ✅ \`$user\` ($kind) |"
            echo "| Token role | \`$token_role\` |"
            echo "| Role in \`$HF_ORG\` | \`${org_role:-not a member}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$org_role" ]; then
            echo "::error::This token's account is not a member of the '$HF_ORG' org, so the \
          pipeline cannot push the model. Join the org or use a token that belongs to it."
            exit 1
          fi

          case "$token_role" in
            write|admin)
              ;;
            fineGrained)
              # Fine-grained tokens carry per-repo scopes that whoami-v2 does not expand,
              # so write access can only be proven by actually pushing. Warn, don't block.
              echo "::warning::Fine-grained token — its scopes cannot be verified here. \
          Confirm it grants write access to '$HF_ORG' or the publish step will fail."
              ;;
            *)
              echo "::error::Token role is '$token_role'; the pipeline needs a write token \
          to publish the model to '$HF_ORG'."
              exit 1
              ;;
          esac

      - name: Prove the token can actually LAUNCH a job
        run: |
          set -uo pipefail

          # This launches a real Job — deliberately. An earlier version of this step only
          # ran `hf jobs ls`, which is a READ: it succeeds without the `job.write`
          # permission and so reported "Jobs available" for a token that could not launch
          # anything. The release run then 403'd on `hf jobs run`. Listing cannot answer
          # "may we launch?"; only launching can.
          #
          # cpu-basic costs $0.0002/min, so this proof costs a fraction of a cent — while
          # the failure it prevents is a GPU run that dies after being billed.
          # --namespace is what the release workflow uses, so the same permission and the
          # same billing account are exercised here.
          if output=$(hf jobs run \
              --namespace "$HF_ORG" \
              --flavor cpu-basic \
              --timeout 5m \
              python:3.11 echo "preflight-ok" 2>&1); then
            echo "$output"
            echo "Job launched and completed under namespace '$HF_ORG'."
            echo "| Can launch jobs (job.write) | ✅ yes |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$output"
            echo "| Can launch jobs (job.write) | ❌ no |" >> "$GITHUB_STEP_SUMMARY"
            case "$output" in
              *job.write*)
                echo "::error::The token lacks the 'job.write' permission on '$HF_ORG'. \
          Edit it at https://huggingface.co/settings/tokens and grant permission to manage \
          Jobs for that org, or use a classic write token belonging to a member."
                ;;
              *)
                echo "::error::Could not launch a job in '$HF_ORG' (see output above). \
          Jobs are billed, so this can also mean the account has no plan that includes them."
                ;;
            esac
            exit 1
          fi

      - name: Show available hardware and pricing
        # Jobs are billed per minute on every flavor — there is no free GPU tier — so the
        # flavor choice is a cost decision. Printing the live table keeps that decision
        # based on current prices rather than on numbers remembered from a doc.
        run: |
          set -uo pipefail
          echo "### HF Jobs hardware & pricing" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if hardware=$(hf jobs hardware 2>&1); then
            echo "$hardware"
            echo "$hardware" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$hardware"
            echo "(unavailable: $hardware)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Could not list hardware flavors; pick a flavor from the docs."
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight passed
        run: echo "::notice::Credentials OK — the release workflow can reach HF Jobs."
