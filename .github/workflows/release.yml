name: release
# Manual only — launches the GPU pipeline on Hugging Face Jobs (billed compute).
# GitHub runners have no GPU, so this job only authenticates to HF and submits the Job.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "HF Jobs GPU flavor"
        # l4x1 ($0.80/h) is the cheapest flavor that runs this pipeline unmodified.
        # t4-small is cheaper ($0.40/h) but the T4 is Turing and has no bf16, which
        # scripts/03_merge.py requires. Every flavor is billed — there is no free GPU.
        default: "l4x1"
      tag:
        description: "Release tag for the HF model repo"
        default: "v0.1"
      ref:
        description: "Git ref (branch or SHA) to build from"
        default: "develop"
      timeout:
        description: "Max Job duration (e.g. 2h) — give training headroom"
        default: "2h"
      stop_before_publish:
        description: "Dry run: train + eval but DO NOT publish (true/false)"
        default: "false"
      max_steps:
        description: "Smoke test: cap optimizer steps (e.g. 10) to validate the chain cheaply; -1 = full run"
        default: "-1"

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Hugging Face CLI
        run: uv tool install "huggingface_hub[cli]"
      - name: Authenticate to Hugging Face
        run: hf auth login --token "${{ secrets.HF_TOKEN }}"
      - name: Launch end-to-end pipeline on HF Jobs (GPU)
        env:
          HF_ORG: ${{ vars.HF_ORG }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_PIPELINE_TOKEN: ${{ secrets.GH_PIPELINE_TOKEN }}
          INPUT_FLAVOR: ${{ inputs.flavor }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
          INPUT_STOP_BEFORE_PUBLISH: ${{ inputs.stop_before_publish }}
          INPUT_MAX_STEPS: ${{ inputs.max_steps }}
        # Flags verified against `hf jobs run --help` (huggingface_hub 1.14.0).
        # Runs attached (no --detach) so this step waits and fails if the eval gate fails.
        # on first use (the CLI evolves). This launches a python:3.11 job that clones
        # the private repo with GH_PIPELINE_TOKEN and runs scripts/run_pipeline.sh.
        run: |
          hf jobs run \
            --flavor "$INPUT_FLAVOR" \
            --timeout "$INPUT_TIMEOUT" \
            -s HF_TOKEN="$HF_TOKEN" \
            -s GH_PIPELINE_TOKEN="$GH_PIPELINE_TOKEN" \
            -e HF_ORG="$HF_ORG" \
            -e TAG="$INPUT_TAG" \
            -e REPO_REF="$INPUT_REF" \
            -e REPO_SLUG="${{ github.repository }}" \
            -e STOP_BEFORE_PUBLISH="$INPUT_STOP_BEFORE_PUBLISH" \
            -e MAX_STEPS="$INPUT_MAX_STEPS" \
            python:3.11 \
            bash -c 'git clone --branch "$REPO_REF" "https://x-access-token:$GH_PIPELINE_TOKEN@github.com/$REPO_SLUG.git" repo && cd repo && bash scripts/run_pipeline.sh'
